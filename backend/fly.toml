# fly.toml app configuration file generated for uniconnect-backend-humming-stone-586 on 2026-05-10T16:58:55-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'uniconnect-backend-humming-stone-586'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'
    tls_skip_verify = false
    tls_server_name = ''

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
